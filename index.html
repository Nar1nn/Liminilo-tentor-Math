<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Liminilo Tentor Math</title>
    
    <!-- Meta Tags for Social Sharing (Open Graph) -->
    <meta property="og:title" content="Liminilo Tentor Math" />
    <meta property="og:description" content="Asisten AI Matematika pribadi lu. Belajar matematika jadi lebih asik bareng Liminilo!" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Konfigurasi Dark Mode untuk Tailwind
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {},
        },
        plugins: [],
      }
    </script>

    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha34-n8MVd4RsNIU0KOVEMeaOijDc5nmXAkhtjW3I9wP9B6oZFiNimNQ4ecLvisaSomzt" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlVjOTmhdwKRsEASoVxF8TBnvgv+nWqlhPAvhioIpvRXMOgSEuiUfb4qvoS" crossorigin="anonymous"></script>

    <!-- ES Module Imports -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
        "remark-math": "https://esm.sh/remark-math@^6.0.0",
        "rehype-katex": "https://esm.sh/rehype-katex@^7.0.0"
      }
    }
    </script>
    <script>
      // Menerapkan tema dari localStorage sebelum React render untuk menghindari FOUC (Flash of Unstyled Content)
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
